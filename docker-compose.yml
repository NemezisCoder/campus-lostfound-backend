x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

x-backend-env: &backend-env
  environment:
    # === Server ===
    APP_ENV: "${APP_ENV:-production}"
    API_V1_STR: "${API_V1_STR:-/api/v1}"
    DB_INIT_ON_STARTUP: "${DB_INIT_ON_STARTUP:-false}"
    HOST: "0.0.0.0"
    PORT: "8000"
    SITE_BASE_URL: "${SITE_BASE_URL:-http://localhost}"
    CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost"]}'

    # === Security ===
    SECRET_KEY: "${SECRET_KEY:-change-me-generate-a-long-random-secret}"
    ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
    REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-30}"
    REVOKE_OLD_SESSIONS_ON_LOGIN: "${REVOKE_OLD_SESSIONS_ON_LOGIN:-true}"

    # === PostgreSQL ===
    POSTGRES_DB: "${POSTGRES_DB:-campus}"
    POSTGRES_USER: "${POSTGRES_USER:-campus}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
    POSTGRES_HOST: "db"
    POSTGRES_PORT: "5432"
    DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-campus}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-campus}"

    # === Media ===
    MEDIA_DIR: "${MEDIA_DIR:-./uploads}"

    # === Weather ===
    OPENWEATHER_API_KEY: "${OPENWEATHER_API_KEY:-}"
    OPENWEATHER_BASE_URL: "${OPENWEATHER_BASE_URL:-https://api.openweathermap.org/data/2.5}"
    CAMPUS_LAT: "${CAMPUS_LAT:-55.6700}"
    CAMPUS_LON: "${CAMPUS_LON:-37.6500}"
    WEATHER_CACHE_SECONDS: "${WEATHER_CACHE_SECONDS:-300}"

    # === S3 / MinIO ===
    S3_ENABLED: "${S3_ENABLED:-true}"
    S3_BUCKET: "${S3_BUCKET:-campus-lostfound}"
    S3_REGION: "${S3_REGION:-us-east-1}"
    S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
    S3_SECRET_KEY: "${S3_SECRET_KEY:-change-me-minio-password}"
    S3_INTERNAL_ENDPOINT: "http://minio:9000"
    S3_EXTERNAL_ENDPOINT: "${S3_EXTERNAL_ENDPOINT:-http://localhost:9010}"

    # === Uploads ===
    PRESIGN_EXPIRES_SECONDS: "${PRESIGN_EXPIRES_SECONDS:-600}"
    MAX_UPLOAD_SIZE_MB: "${MAX_UPLOAD_SIZE_MB:-5}"
    ALLOWED_IMAGE_MIME: "${ALLOWED_IMAGE_MIME:-image/jpeg,image/png,image/webp}"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-campus}"
      POSTGRES_USER: "${POSTGRES_USER:-campus}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:-change-me-minio-password}"
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: "${S3_BUCKET:-campus-lostfound}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-change-me-minio-password}"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET}
      "
    networks:
      - app

  migrate:
    image: ${BACKEND_IMAGE:-campus-lostfound-backend:local}
    build: *backend-build
    <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks:
      - app

  backend:
    image: ${BACKEND_IMAGE:-campus-lostfound-backend:local}
    build: *backend-build
    <<: *backend-env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app

  frontend:
    image: ${FRONTEND_IMAGE:-campus-lostfound-frontend:local}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - edge

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
      - app

networks:
  edge:
  app:

volumes:
  postgres-data:
  minio-data: